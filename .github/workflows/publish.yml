name: Publish signed RPM repository

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: First publication when no Pages deployment exists
        required: false
        type: boolean
        default: false
      renew_signing_key:
        description: Explicitly refresh signed metadata or renew the same-fingerprint public key
        required: false
        type: boolean
        default: false

concurrency:
  group: norm-rpm-publication
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

env:
  NORM_TOOLING_COMMIT: cf58cbb234ba9e12409ec2f2c2d656332b0163ff
  RPM_SITE_URL: https://normlanguage.github.io/rpm

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      RPM_BOOTSTRAP: ${{ inputs.bootstrap || false }}
      RPM_RENEW_SIGNING_KEY: ${{ inputs.renew_signing_key || false }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: normlanguage/Norm
          ref: ${{ env.NORM_TOOLING_COMMIT }}
          path: norm-tooling

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test shared release selection and immutable planning
        run: node --test norm-tooling/cli/compiler/scripts/release-publication.test.mjs norm-tooling/cli/compiler/scripts/rpm-publication.test.mjs

      - name: Select attested releases and verify existing publication
        id: plan
        run: node scripts/prepare.mjs norm-tooling "$RPM_SITE_URL" handoff "$NORM_TOOLING_COMMIT"

      - name: Preserve verified inputs
        if: steps.plan.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rpm-publication-inputs
          path: handoff/
          if-no-files-found: error

  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    container: registry.fedoraproject.org/fedora@sha256:f4daff1c8e5c94219817f8b0c39f9c4510231e9b1cf806a3bfe575e92737a815
    environment: production
    env:
      GNUPGHOME: ${{ github.workspace }}/.rpm-gnupg
      RPM_SIGNING_SUBKEY: ${{ secrets.RPM_SIGNING_SUBKEY }}
      RPM_SIGNING_FINGERPRINT: ${{ vars.RPM_SIGNING_FINGERPRINT }}
    steps:
      - name: Install Fedora package and metadata tools
        run: dnf -y install cpio createrepo_c gcc git gnupg2 nodejs python3 rpm-build rpm-sign tar

      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: normlanguage/Norm
          ref: ${{ env.NORM_TOOLING_COMMIT }}
          path: norm-tooling

      - uses: actions/download-artifact@v5
        with:
          name: rpm-publication-inputs
          path: handoff

      - name: Verify RPM packaging and repository signatures with Fedora tools
        run: node --test norm-tooling/cli/compiler/scripts/rpm-repository.integration.test.mjs

      - name: Verify full RPM payload comparison gate
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p test_verify_payload.py

      - name: Import signing subkey
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$RPM_SIGNING_SUBKEY" | gpg --batch --import
          test -n "$RPM_SIGNING_FINGERPRINT"
          gpg --with-colons --list-secret-keys "$RPM_SIGNING_FINGERPRINT" | awk -F: -v expected="$RPM_SIGNING_FINGERPRINT" '$1 == "fpr" && $10 == expected { found = 1 } END { exit !found }'

      - name: Build and sign missing packages and both repository snapshots
        run: node scripts/build.mjs norm-tooling handoff built "$RPM_SIGNING_FINGERPRINT" RPM-GPG-KEY-normlang

      - name: Upload signed candidate
        uses: actions/upload-artifact@v4
        with:
          name: rpm-signed-candidate
          path: |
            built/site/
            built/site-old/
            built/evidence/
          if-no-files-found: error

  consumer:
    needs: build
    runs-on: ubuntu-22.04
    container: registry.fedoraproject.org/fedora@sha256:f4daff1c8e5c94219817f8b0c39f9c4510231e9b1cf806a3bfe575e92737a815
    env:
      NORM_RPM_FULL_ACCEPTANCE: '1'
      NORM_RPM_EVIDENCE_DIRECTORY: ${{ github.workspace }}/rpm-evidence
    steps:
      - name: Install consumer harness only
        run: dnf -y install curl diffutils findutils gnupg2 nodejs python3 util-linux

      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: normlanguage/Norm
          ref: ${{ env.NORM_TOOLING_COMMIT }}
          path: norm-tooling

      - uses: actions/download-artifact@v5
        with:
          name: rpm-signed-candidate
          path: candidate

      - uses: actions/download-artifact@v5
        with:
          name: rpm-publication-inputs
          path: handoff

      - name: Install, upgrade, validate CLI LSP Native, and remove
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p 'require("./handoff/plan.json").selected[0].version')"
          previous="$(node -p 'require("./handoff/plan.json").selected[1].version')"
          release_upgrade="$(node -p 'require("./handoff/plan.json").releaseUpgrade ? "yes" : "no"')"
          fingerprint="$(node -p 'require("./release.json").fingerprint')"
          cd norm-tooling
          bash cli/compiler/scripts/rpm-acceptance.sh ../candidate/site-old ../candidate/site ../rpm-repository-live "$current" "$previous" "$fingerprint" "$release_upgrade"

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpm-acceptance-evidence
          path: rpm-evidence/
          if-no-files-found: warn

  deploy:
    needs: [build, consumer]
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: rpm-signed-candidate
          path: candidate

      - uses: actions/upload-pages-artifact@v4
        with:
          path: candidate/site

      - id: pages
        uses: actions/deploy-pages@v4

  public-consumer:
    needs: deploy
    runs-on: ubuntu-22.04
    container: registry.fedoraproject.org/fedora@sha256:f4daff1c8e5c94219817f8b0c39f9c4510231e9b1cf806a3bfe575e92737a815
    steps:
      - name: Install public consumer harness only
        run: dnf -y install curl diffutils findutils gnupg2 nodejs python3 util-linux

      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: normlanguage/Norm
          ref: ${{ env.NORM_TOOLING_COMMIT }}
          path: norm-tooling

      - uses: actions/download-artifact@v5
        with:
          name: rpm-publication-inputs
          path: handoff

      - name: Install and upgrade from public HTTPS source
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p 'require("./handoff/plan.json").selected[0].version')"
          previous="$(node -p 'require("./handoff/plan.json").selected[1].version')"
          bash scripts/public-acceptance.sh "$RPM_SITE_URL" "$current" "$previous"
